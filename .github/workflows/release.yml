name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.0

      - name: Restore Android signing key (optional)
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/ai-wrong-notebook-release.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
              "$ANDROID_KEYSTORE_PASSWORD" \
              "$ANDROID_KEY_PASSWORD" \
              "$ANDROID_KEY_ALIAS" \
              "$KEYSTORE_PATH" > android/key.properties
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "未配置签名 secrets，产物将使用 debug 签名（可直接安装，不能上架应用市场）。"
          fi

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release bundle
        run: flutter build appbundle --release

      - name: Verify APK signing certificate
        if: steps.signing.outputs.available == 'true'
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -path '*/apksigner' -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk | tee /tmp/apksigner.txt
          grep -qi 'certificate SHA-256 digest: 25862f0436894d64bf32e54b46ff11711ee76a36af807959a68f76e989885e60' /tmp/apksigner.txt

      - name: Create APK archive
        run: |
          cd build/app/outputs/flutter-apk
          zip -j "ai-wrong-notebook-${{ github.ref_name }}.zip" app-release.apk

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 || \
          gh release create "${{ github.ref_name }}" --title "AI错题本 ${{ github.ref_name }}" --notes "Automated release for ${{ github.ref_name }}"

      - name: Upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "ai-wrong-notebook-${{ github.ref_name }}.apk"
          gh release upload "${{ github.ref_name }}" "ai-wrong-notebook-${{ github.ref_name }}.apk" --clobber

      - name: Upload APK archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            build/app/outputs/flutter-apk/ai-wrong-notebook-${{ github.ref_name }}.zip \
            --clobber

      - name: Upload AAB
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/bundle/release/app-release.aab "ai-wrong-notebook-${{ github.ref_name }}.aab"
          gh release upload "${{ github.ref_name }}" "ai-wrong-notebook-${{ github.ref_name }}.aab" --clobber
